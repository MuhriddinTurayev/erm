# Oftob_Sohtumon — nginx внутри контейнера (порт 80). HTTPS делает внешний прокси или Caddy (см. DEPLOY.md).
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # 3D-модели загружаются частями по 5 МБ, фото и файлы — до 20 МБ
    client_max_body_size 64m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream text/plain application/xml;

    # статика: стили, скрипты, иконки, небо для 3D — кэш в браузере
    location ~* \.(?:css|js|png|jpe?g|webp|svg|ico|woff2?|hdr|glb)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # служебные файлы не отдаём
    location ~ /\.(?!well-known) { deny all; }
}
