; Oftob_Sohtumon — пул PHP-FPM: только внутри контейнера, число процессов под небольшой VPS
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
clear_env = no
; запросы уже пишет nginx — второй такой же журнал не нужен
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
